name: Mobile EAS Build

# Этот workflow собирает мобильное приложение через Expo Application Services (EAS).
# Для работы нужен бесплатный аккаунт на expo.dev и токен.
#
# Настройка:
# 1. Зарегистрируйтесь на https://expo.dev и создайте проект
# 2. Выполните локально: npx eas login
# 3. Создайте токен: npx eas token:create
# 4. Добавьте токен в GitHub Secrets как EXPO_TOKEN
# 5. Раскомментируйте workflow ниже

on:
  workflow_dispatch:
#  push:
#    branches: [main, master]
#    tags: ['v*']

jobs:
  eas-build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive
